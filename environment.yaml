name: ecological-agent-skills
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - r-base=4.4.1

  # ── Core Python ────────────────────────────────────────────────────────
  - numpy=1.26.4
  - pandas=2.2.2
  - scipy=1.13.1
  - matplotlib=3.9.0
  - seaborn=0.13.2

  # ── Geospatial Python ─────────────────────────────────────────────────
  - geopandas=0.14.4
  - rasterio=1.3.10
  - shapely=2.0.4
  - pyproj=3.6.1
  - fiona=1.9.6
  - rasterstats=0.19.0

  # ── Statistics / ML Python ────────────────────────────────────────────
  - scikit-learn=1.5.0
  - statsmodels=0.14.2

  # ── Ecology Python ────────────────────────────────────────────────────
  - pip

  # ── Acoustic monitoring Python ────────────────────────────────────────
  - librosa=0.10.2
  - soundfile=0.12.1

  # ── Landscape connectivity Python ─────────────────────────────────────
  - networkx=3.3
  - scikit-image=0.23.2

  # ── Workflow Python ───────────────────────────────────────────────────
  - pyyaml=6.0.1
  - pathlib2=2.3.7

  # ── R core packages (via conda-forge) ─────────────────────────────────
  - r-terra=1.7_78
  - r-sf=1.0_16
  - r-dplyr=1.1.4
  - r-ggplot2=3.5.1
  - r-tidyr=1.3.1
  - r-readr=2.1.5
  - r-yaml=2.3.8
  - r-janitor=2.2.0
  - r-lubridate=1.9.3
  - r-zoo=1.8_12
  - r-broom=1.0.6

  # ── R statistics ──────────────────────────────────────────────────────
  - r-lme4=1.1_35.3
  - r-emmeans=1.10.2
  - r-mumin=1.47.5
  - r-effectsize=0.8.9
  - r-corrplot=0.92

  # ── R ecology ─────────────────────────────────────────────────────────
  - r-vegan=2.6_6.1
  - r-unmarked=1.4.1
  - r-gbm=2.2.2
  - r-randomforest=4.7_1.1
  - r-trend=1.1.6

  # ── R advanced skills (v2.0.0) ────────────────────────────────────────
  - r-igraph=2.0.3
  - r-ggrepel=0.9.5

  pip:
    # Python ecology (not on conda-forge)
    - pymannkendall==1.4.3
    - scikit-bio==0.6.2
    - elapid==1.1.2

    # R packages not on conda-forge (install via renv after environment creation)
    # See renv.lock for: CoordinateCleaner, blockCV, maxnet, biomod2,
    #                    bfast, landscapemetrics, DHARMa, glmmTMB, betapart, SPEI,
    #                    camtrapR, overlap, circular, soundecology, tuneR,
    #                    popbio, prioritizr, highs

variables:
  R_LIBS_USER: "${CONDA_PREFIX}/lib/R/library"
  OMP_NUM_THREADS: "4"
