name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  structural-check:
    name: Structural integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ci_check.sh
        run: bash tests/ci_check.sh

  verify-env:
    name: Geospatial stack smoke test (Python + R)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python geospatial stack
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy matplotlib packaging
          pip install rasterio geopandas shapely pyproj pyogrio

      - name: Set up R 4.4
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      - name: Install R geospatial stack
        run: |
          Rscript -e "install.packages(c('terra','sf','units'), repos='https://cloud.r-project.org')"

      - name: Run verify-env smoke test
        run: bash tests/verify_env.sh

  python-tests:
    name: Python unit tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install pandas numpy scipy scikit-learn statsmodels
          pip install pygbif>=0.6.3 requests pymannkendall
          # geospatial — wheels available on GH Actions ubuntu (no system libs needed)
          pip install geopandas rasterio shapely pyproj fiona rasterstats
          # optional extras — skip if build fails (e.g. elapid on Python 3.12+)
          pip install librosa soundfile networkx scikit-image || true
          pip install elapid || true

      - name: Run pytest
        working-directory: tests/python
        run: |
          pytest . -v --tb=short \
            --ignore=test_download_sources.py \
            -p no:warnings
        env:
          PYTHONPATH: ${{ github.workspace }}/skills

      - name: Run integration tests
        working-directory: tests/python
        continue-on-error: true
        run: |
          pytest test_integration.py -v --tb=short -p no:warnings
        env:
          PYTHONPATH: ${{ github.workspace }}/skills

  r-tests:
    name: R unit tests (testthat)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      - name: Install R packages
        run: |
          Rscript -e "install.packages(c('testthat', 'dplyr', 'readr', 'vegan', 'lme4'), repos='https://cloud.r-project.org')"

      - name: Run R tests
        run: Rscript tests/r/run_all_tests.R

  frontmatter-check:
    name: Frontmatter validation (name + description)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check name and description in all SKILL.md files
        run: |
          failed=0
          for f in skills/*/SKILL.md; do
            if ! grep -q "^name:" "$f"; then
              echo "MISSING name: in $f"
              failed=1
            fi
            if ! grep -q "^description:" "$f"; then
              echo "MISSING description: in $f"
              failed=1
            fi
          done
          exit $failed
