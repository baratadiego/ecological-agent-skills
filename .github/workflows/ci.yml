name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  structural-check:
    name: Structural integrity (585 checks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ci_check.sh
        run: bash tests/ci_check.sh
